<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:0 14px 90px}
a{color:var(--ac);word-break:break-all}
header{display:flex;align-items:center;gap:10px;padding:16px 2px}
.lv{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.hb{flex:1;min-width:0}.hb b{font-size:14px}.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;transition:width .4s}
.coin{background:var(--card);padding:6px 10px;border-radius:18px;font-weight:700;font-size:13px;box-shadow:0 1px 3px #0001;white-space:nowrap}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px #0000000f}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:18px 4px 8px}
.timer{text-align:center;background:linear-gradient(160deg,var(--ac),var(--ac2));color:#fff}
.ring{position:relative;width:230px;height:230px;margin:6px auto}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;font-weight:800;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.chip{border:0;background:#ffffff30;color:#fff;border-radius:16px;padding:7px 14px;font-size:14px;cursor:pointer}.chip.on{background:#fff;color:var(--ac);font-weight:700}
.chip.t{background:var(--line);color:var(--tx)}.chip.t.on{background:var(--ac);color:#fff}
.btn{border:0;border-radius:14px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;background:var(--ac);color:#fff}
.timer .btn{background:#fff;color:var(--ac);min-width:120px}.btn.g{background:var(--line);color:var(--tx)}.btn.s{padding:8px 14px;font-size:13px;border-radius:12px}.btn[disabled]{opacity:.5}

.tm{flex:1;min-width:0}.tm b{display:block;font-size:15px;cursor:pointer}.tm small{color:var(--mu);font-size:12.5px}
.tag{font-size:12px;padding:3px 9px;border-radius:10px;background:var(--line);color:var(--mu);white-space:nowrap}.late{background:#e5484d22;color:var(--bad);font-weight:700}.soon{background:#e08a0022;color:var(--warn);font-weight:700}
.dt{background:var(--bg);border-radius:14px;padding:12px;margin:0 0 10px;font-size:14px}.dt p{margin:0 0 8px}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}

label{font-size:12.5px;color:var(--mu)}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{text-align:center;margin:0}.item .e{font-size:34px}.item small{color:var(--mu);display:block;margin:3px 0 8px;font-size:12.5px}.item img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.ach{display:flex;gap:12px;align-items:center;padding:8px 0;opacity:.45}.ach.u{opacity:1}.ach .e{font-size:28px}
.ar{display:flex;gap:8px;align-items:center}.ar input{margin:4px 0}.ar .s1{width:58px;flex:none;text-align:center}.ar .s2{width:78px;flex:none}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.pick label{display:inline-flex;gap:5px;align-items:center;background:var(--line);color:var(--tx);padding:6px 11px;border-radius:14px;font-size:13.5px}.pick input{width:auto;margin:0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140px);background:#1d1b2e;color:#fff;padding:11px 18px;border-radius:16px;transition:transform .35s;z-index:9;font-size:14px;max-width:90%}.toast.s{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mu);padding:18px}
.ico{display:inline-grid;place-items:center;width:var(--s,40px);height:var(--s,40px);border-radius:28%;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 -3px 0 #0003,inset 0 1px 0 #fff6,0 2px 4px #0003;position:relative;flex:none;overflow:hidden;vertical-align:middle;color:#fff;font-weight:700}.ico::after{content:'';position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(#ffffff59,#ffffff0a);border-radius:28% 28% 60% 60%/28% 28% 24% 24%}.ico svg{width:62%;height:62%;position:relative;z-index:1;filter:drop-shadow(0 1px 0 #0004)}nav button span{display:flex;justify-content:center;margin-bottom:2px}nav .on .ico{box-shadow:0 0 0 3px var(--ac),0 2px 4px #0003}.coin{display:flex;align-items:center;gap:4px}.tile{position:relative;text-align:center;margin:0}.badge{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;border-radius:12px;padding:2px 9px;font-weight:800;font-size:13px}.ln{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 10px}.tile img{width:56px;height:56px;border-radius:14px;object-fit:cover}

:root{--k:#2b2140}

.lv{border-radius:8px;border:3px solid var(--k);box-shadow:inset 0 -4px 0 #0003,inset 0 3px 0 #fff4;font-weight:900}
.bar{height:16px;background:#fff;border:3px solid var(--k);border-radius:4px;margin-top:0}
.bar i{border-radius:0;background:repeating-linear-gradient(90deg,#0000 0 8px,#00000026 8px 10px),linear-gradient(var(--ac2) 0 40%,var(--ac) 40%)}
.bw{display:flex;align-items:center;gap:6px;margin-top:6px}.bw .bar{flex:1}
nav .on .ico{transform:translateY(-3px)}h2{font-size:12px;font-weight:900}
</style>

function pxs(k){if(PXC[k])return PXC[k];const R=PX[k].split('|'),oy=Math.floor((12-R.length)/2);let o='';R.forEach((r,y)=>{r=r.padEnd(12,'.');let x=0;while(x<12){const c=r[x];if(c=='.'){x++;continue}let e=x;while(e<12&&r[e]==c)e++;o+=`<rect x='${x}' y='${y+oy}' width='${e-x}' height='1' fill='${PAL[c]}'/>`;x=e}});return PXC[k]=`<svg viewBox='0 0 12 12' shape-rendering='crispEdges'>${o}</svg>`}

else h+=`<div class="grid">${S.shop.map(s=>{const a=s.ml.a?S.attrs.find(x=>x.id==s.ml.a):null,lk_=a&&lvl(a.x).n<s.ml.l,L_=s.lim||{p:'0',n:1},bc=L_.p!='0'?bought(s):0;return `<div class="card item">${s.img?`<img src="${s.img}" alt="">`:`${ico(s.i,56)}`}<br><b>${esc(s.n)}</b><small>${s.p?ico('coin',16)+' '+s.p:''} ${s.g?ico('gem',16)+' '+s.g:''}${!s.p&&!s.g?'za darmo':''} · masz: ${s.q}${a?`<br>${lk_?'🔒 ':''}${esc(a.i)} ${esc(a.n)} ≥ ${s.ml.l}`:''}${L_.p!='0'?`<br>Limit ${bc}/${L_.n} ${LP[L_.p]}`:''}</small>${s.desc?`<small style="text-align:left">${s.u?lk(s.desc):'🔒 opis i link po zakupie'}</small>`:''}<button class="btn s" onclick="buy(${s.id})" ${L_.p!='0'&&bc>=L_.n?'disabled':''}>Kup</button> ${s.q>0?`<button class="btn s g" onclick="useI(${s.id})">Użyj</button>`:''}</div>`}).join('')}</div>`}
if(tab=='chest'){const own=S.shop.filter(s=>s.q>0);h=own.length?`<div class="grid">${own.map(s=>`<div class="card tile"><span class="badge">×${s.q}</span>${s.img?`<img src="${s.img}" alt="">`:ico(s.i,56)}<br><b>${esc(s.n)}</b><div class="ln">${s.desc?lk(s.desc.split('\n')[0]):'&nbsp;'}</div><button class="btn s" onclick="useI(${s.id})">Użyj</button></div>`).join('')}</div>`:'<div class="card empty">Skrzynia jest pusta. Kup coś w sklepie.</div>'}
if(tab=='me'){const mx=1;const lst=(k,ph,f)=>`<div class="card">${S[k].map(a=>`<div class="ar">${f?`${ico(a.i,34)}<input class="s1" value="${esc(a.i)}" onchange="up('${k}',${a.id},'i',this.value)">`:''}<input value="${esc(a.n)}" onchange="up('${k}',${a.id},'n',this.value)">${k=='attrs'?`<b style="min-width:62px;text-align:right">Poz. ${lvl(a.x).n}</b>`:''}<button class="x" onclick="del('${k}',${a.id})">🗑</button></div>${k=='attrs'?`<div class="bar" style="margin:0 0 8px"><i style="width:${lvl(a.x).cur/lvl(a.x).need*100}%"></i></div>`:''}`).join('')}<button class="btn s" onclick="add('${k}',${ph})">+ Dodaj</button></div>`;
h=`<h2>Atrybuty (awans = 💎)</h2>${lst('attrs',"{i:'⭐',n:'Nowy atrybut',x:0}",1)}<h2>Foldery</h2>${lst('folders',"{i:'📁',n:'Nowy folder'}",1)}<h2>Tagi</h2>${lst('tags',"{n:'nowy'}",0)}
<h2>Motyw</h2><div class="card"><div class="chips" style="justify-content:flex-start;margin:0">${TH.map(t=>`<button class="chip t ${S.theme==t[0]?'on':''}" onclick="S.theme='${t[0]}';save();render()">${t[1]}</button>`).join('')}</div></div>
<h2>Powiadomienia</h2><div class="card"><p style="margin:0 0 12px;font-size:14px;color:var(--mu)">Działają według przypominajki ustawionej przy każdym zadaniu.</p><button class="btn s ${S.notif?'':'g'}" onclick="togN()">${S.notif?'Włączone ✓':'Włącz'}</button></div>
<h2>Osiągnięcia</h2><div class="card">${ACH.map((a,i)=>`<div class="ach ${S.ach[i]?'u':''}">${ico(a[0],38)}<div><b>${a[1]}</b><br><small style="color:var(--mu)">${a[2]}</small></div></div>`).join('')}</div>
<h2>Kopia zapasowa</h2><div class="card"><p style="margin:0 0 12px;font-size:14px;color:var(--mu)">Dane są tylko na tym urządzeniu. Zapisz plik w pamięci telefonu lub na Dysku Google przez systemowy wybór pliku.</p><button class="btn s" onclick="exp_()">Eksportuj</button> <button class="btn s g" onclick="$('#imp').click()">Importuj</button><input id="imp" type="file" accept="application/json" hidden onchange="imp_(this)"></div>`}
$('#main').innerHTML=h;tick()}
const A_ids=()=>active().map(t=>t.id);
function exp_(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='gamefy-kopia-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp_(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!['tasks','attrs','shop','folders','tags'].every(k=>Array.isArray(d[k])))throw 0;S=d;save();render();toast('Kopię wczytano')}catch(e){toast('Nieprawidłowy plik')}};r.readAsText(f)}
render();pen();chk();setInterval(tick,250);setInterval(()=>{if(tab=='home'&&!T.run&&!TT.run)render();pen();chk()},60000);
</script>
</body>
</html>

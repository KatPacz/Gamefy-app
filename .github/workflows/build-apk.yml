
name: Zbuduj APK Gamefy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Skonfiguruj Android SDK
        uses: android-actions/setup-android@v4

      - name: Przygotuj Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Sprawdz Gradle
        run: gradle --version

      - name: Utworz testowy klucz APK
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Zbuduj instalacyjny APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Zapisz APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Gamefy-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
